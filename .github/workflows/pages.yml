name: Check and publish Niri Plus

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niri-plus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Offline staging tests read the immutable example snapshot from Git history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install Zsh for isolated shell checks
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes zsh
          # The hosted image leaves system-owned completion ancestors writable.
          # Restore their normal audit boundary before copying fixture functions.
          sudo chmod go-w / /usr /usr/share /usr/share/zsh
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Check and build
        run: |
          python -B -m unittest discover -s tests -v
          python -B scripts/export-components.py --check
          python -B scripts/check-desktop.py
          python -B scripts/check-terminal.py
          git diff --check
          python -B scripts/build-components.py --output "${RUNNER_TEMP}/niri-plus-components" --source-commit "$GITHUB_SHA"
          python -B scripts/build.py --output "${RUNNER_TEMP}/niri-plus"
      - name: Check browser behavior
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/check-browser.mjs "${RUNNER_TEMP}/niri-plus"
      - name: Upload checked site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/niri-plus
          include-hidden-files: true
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
