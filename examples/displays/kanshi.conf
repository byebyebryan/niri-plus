# Portable profile skeleton. Replace connectors/modes with `niri msg outputs`.
# Put the more specific dock profile before the internal-only fallback.
profile docked {
    output eDP-1 enable scale 1.5 position 0,0
    output DP-1 enable mode 2560x1440 scale 1 position 1280,0
}

profile internal {
    output eDP-1 enable scale 1.5 position 0,0
}
